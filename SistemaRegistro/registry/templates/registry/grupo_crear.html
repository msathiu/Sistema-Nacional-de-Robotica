{% extends 'users/base_dashboard.html' %}
{% load static %}

{% block title %}Crear Grupo{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="mb-4">
        <h2><i class="fas fa-users-cog"></i> Crear Nuevo Grupo</h2>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'dashboard_institucional' %}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{% url 'grupos_institucion' %}">Grupos</a></li>
                <li class="breadcrumb-item active">Crear</li>
            </ol>
        </nav>
    </div>

    <form method="POST" id="formGrupo">
        {% csrf_token %}
        
        <!-- Sección 1: Datos del Grupo -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="fas fa-info-circle"></i> Datos del Grupo</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nombre del Grupo <span class="text-danger">*</span></label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Criterio de Agrupación <span class="text-danger">*</span></label>
                        <select name="criterio" class="form-select" required>
                            {% for value, label in criterios %}
                            <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección 2: Datos del Tutor -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0"><i class="fas fa-user-tie"></i> Datos del Tutor</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Cédula <span class="text-danger">*</span></label>
                        <input type="text" name="tutor_cedula" id="tutorCedula" class="form-control" required>
                        <small class="text-muted">Ej: V12345678</small>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Nombres <span class="text-danger">*</span></label>
                        <input type="text" name="tutor_nombre" id="tutorNombre" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Apellidos <span class="text-danger">*</span></label>
                        <input type="text" name="tutor_apellidos" id="tutorApellidos" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Teléfono <span class="text-danger">*</span></label>
                        <input type="text" name="tutor_telefono" class="form-control" required>
                        <small class="text-muted">Ej: 0424-1234567</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección 3: Participantes -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-user-friends"></i> Participantes</h5>
                <button type="button" class="btn btn-light btn-sm" onclick="agregarParticipante()">
                    <i class="fas fa-plus"></i> Agregar Participante
                </button>
            </div>
            <div class="card-body">
                <div id="listaParticipantes">
                    <!-- Los participantes se agregarán aquí dinámicamente -->
                </div>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'grupos_institucion' %}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancelar
            </a>
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Guardar Grupo
            </button>
        </div>
    </form>
</div>

<!-- Template para Participante -->
<template id="templateParticipante">
    <div class="card mb-3 participante-card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h6 class="mb-0">Participante <span class="numero-participante"></span></h6>
                <button type="button" class="btn btn-sm btn-danger" onclick="eliminarParticipante(this)">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Cédula/Escolar</label>
                    <input type="text" class="form-control cedula-participante" placeholder="V12345678">
                    <button type="button" class="btn btn-sm btn-outline-primary mt-1 w-100" onclick="buscarParticipante(this)">
                        <i class="fas fa-search"></i> Buscar
                    </button>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nombres</label>
                    <input type="text" class="form-control nombres-participante" name="participantes[]">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Apellidos</label>
                    <input type="text" class="form-control apellidos-participante">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Fecha Nacimiento</label>
                    <input type="date" class="form-control fecha-participante">
                </div>
            </div>
        </div>
    </div>
</template>

<script>
let contadorParticipantes = 0;

function agregarParticipante() {
    contadorParticipantes++;
    const template = document.getElementById('templateParticipante');
    const clone = template.content.cloneNode(true);
    clone.querySelector('.numero-participante').textContent = contadorParticipantes;
    document.getElementById('listaParticipantes').appendChild(clone);
}

function eliminarParticipante(btn) {
    btn.closest('.participante-card').remove();
}

function buscarParticipante(btn) {
    const card = btn.closest('.participante-card');
    const cedula = card.querySelector('.cedula-participante').value;
    
    if (!cedula) {
        alert('Ingrese una cédula');
        return;
    }
    
    fetch(`/registry/api/buscar-participante/?cedula=${cedula}`)
        .then(res => res.json())
        .then(data => {
            if (data.found) {
                card.querySelector('.nombres-participante').value = data.nombres;
                card.querySelector('.apellidos-participante').value = data.apellidos;
                card.querySelector('.fecha-participante').value = data.fecha_nacimiento;
                card.querySelector('.nombres-participante').name = `participantes[]`;
                card.querySelector('.nombres-participante').value = data.id;
                alert('Participante encontrado');
            } else {
                if (confirm('Participante no encontrado. ¿Desea crear uno nuevo?')) {
                    // Habilitar campos para crear nuevo
                    card.querySelector('.nombres-participante').readOnly = false;
                    card.querySelector('.apellidos-participante').readOnly = false;
                }
            }
        });
}

// Agregar un participante por defecto al cargar
document.addEventListener('DOMContentLoaded', function() {
    agregarParticipante();
});
</script>
{% endblock %}
