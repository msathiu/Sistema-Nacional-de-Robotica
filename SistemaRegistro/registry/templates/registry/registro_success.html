<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Exitoso - Sistema de Robótica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow text-center">
                    <div class="card-body p-5">
                        <div class="text-success mb-4">
                            <svg width="80" height="80" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                            </svg>
                        </div>
                        <h2 class="card-title text-success">¡Registro Exitoso!</h2>
                        <p class="card-text lead">Tu cuenta ha sido creada exitosamente en el Sistema Nacional de Robótica.</p>
                        <p class="text-muted">Ahora puedes iniciar sesión con tus credenciales.</p>
                        <div class="d-grid gap-2 mt-4">
                            <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Iniciar Sesión</a>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary">Volver al Inicio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
