{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Registro Nacional de Robótica{% endblock %}</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --blue-main: #0b2c6d;
            --blue-dark: #051636;
            --accent-cyan: #00d4ff;
            --bg-light: #f8fafc;
        }

        body {
            background-color: var(--bg-light);
            font-family: "Inter", sans-serif;
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .navbar-brand {
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
        }

        /* Patrón de fondo global */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px);
            background-size: 24px 24px;
            z-index: -1;
            opacity: 0.5;
        }

        /* NAVBAR MEJORADA */
        .navbar {
            background: rgba(11, 44, 109, 0.98) !important;
            backdrop-filter: blur(10px);
            border-bottom: 3px solid var(--accent-cyan);
            padding: 0.6rem 0; /* Un poco más compacta */
        }

        .navbar-brand img {
            max-height: 50px; /* Tamaño controlado del logo */
            width: auto;
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.2));
            transition: transform 0.3s ease;
        }

        .navbar-brand:hover img {
            transform: scale(1.05);
        }

        .nav-link {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.8) !important;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--accent-cyan) !important;
        }

        main { flex: 1; }

        footer {
            background: var(--blue-dark);
            color: #94a3b8;
            padding: 2rem 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .footer-logo-text {
            color: white;
            font-family: "Space Grotesk", sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="bg-pattern"></div>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                <img src="{% static 'images/fvrc_logo.png' %}" alt="Logo FVRC">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">
                            <i class="bi bi-house-door me-1"></i> Inicio
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="fade-in">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container text-center">
            <div class="mb-3">
                <span class="footer-logo-text">FVRC</span>
                <div class="mx-auto mt-1" style="width: 30px; height: 2px; background: var(--accent-cyan);"></div>
            </div>
            <p class="small mb-1">Federación Venezolana de Robótica Creativa</p>
            <p class="text-secondary small mb-0">
                &copy; 2025 SNR Venezuela.
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
