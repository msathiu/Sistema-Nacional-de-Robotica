{% comment %}
EJEMPLO DE USO DEL FILTRADO EN CASCADA EN FORMULARIOS PÚBLICOS
Copiar este código en cualquier template que necesite selección de ubicación
{% endcomment %}

{% load static %}

<!-- Incluir jQuery si no está ya incluido -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Formulario de ejemplo -->
<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label for="id_estado" class="form-label">Estado</label>
        <select name="estado" id="id_estado" class="form-select" required>
            <option value="">Seleccione un estado</option>
            {% for estado in estados %}
                <option value="{{ estado.id }}">{{ estado.nombre }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="id_municipio" class="form-label">Municipio</label>
        <select name="municipio" id="id_municipio" class="form-select" required disabled>
            <option value="">Primero seleccione un estado</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="id_parroquia" class="form-label">Parroquia</label>
        <select name="parroquia" id="id_parroquia" class="form-select" required disabled>
            <option value="">Primero seleccione un municipio</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
</form>

<!-- JavaScript para el filtrado en cascada -->
<script>
$(document).ready(function() {
    const $estado = $('#id_estado');
    const $municipio = $('#id_municipio');
    const $parroquia = $('#id_parroquia');

    function cargarMunicipios(estadoId) {
        if (!estadoId) {
            $municipio.html('<option value="">Primero seleccione un estado</option>').prop('disabled', true);
            $parroquia.html('<option value="">Primero seleccione un municipio</option>').prop('disabled', true);
            return;
        }

        $municipio.html('<option value="">Cargando...</option>').prop('disabled', true);

        $.ajax({
            url: `/api/municipios/${estadoId}/`,
            method: 'GET',
            success: function(data) {
                let options = '<option value="">Seleccione un municipio</option>';
                data.forEach(function(item) {
                    options += `<option value="${item.id}">${item.nombre}</option>`;
                });
                $municipio.html(options).prop('disabled', false);
                $parroquia.html('<option value="">Primero seleccione un municipio</option>').prop('disabled', true);
            },
            error: function(xhr) {
                if (xhr.status === 403) {
                    alert('Debe iniciar sesión para continuar');
                    window.location.href = '/login/';
                } else {
                    $municipio.html('<option value="">Error al cargar municipios</option>');
                }
            }
        });
    }

    function cargarParroquias(municipioId) {
        if (!municipioId) {
            $parroquia.html('<option value="">Primero seleccione un municipio</option>').prop('disabled', true);
            return;
        }

        $parroquia.html('<option value="">Cargando...</option>').prop('disabled', true);

        $.ajax({
            url: `/api/parroquias/${municipioId}/`,
            method: 'GET',
            success: function(data) {
                let options = '<option value="">Seleccione una parroquia</option>';
                data.forEach(function(item) {
                    options += `<option value="${item.id}">${item.nombre}</option>`;
                });
                $parroquia.html(options).prop('disabled', false);
            },
            error: function(xhr) {
                if (xhr.status === 403) {
                    alert('Debe iniciar sesión para continuar');
                    window.location.href = '/login/';
                } else {
                    $parroquia.html('<option value="">Error al cargar parroquias</option>');
                }
            }
        });
    }

    $estado.on('change', function() {
        cargarMunicipios($(this).val());
    });

    $municipio.on('change', function() {
        cargarParroquias($(this).val());
    });
});
</script>
