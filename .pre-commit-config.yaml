repos:
-   repo: https://github.com
    rev: v4.5.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

# --- AQUÍ AGREGASTE BLACK ---
-   repo: https://github.com
    rev: 23.12.1
    hooks:
    -   id: black
        language_version: python3

-   repo: https://github.com
    rev: v1.4.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
