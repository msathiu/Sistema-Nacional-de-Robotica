services:
  # --- BASE DE DATOS ---
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # [CAMBIO PRODUCCIÓN]: Eliminar completamente la sección 'ports'.
    # Solo debe usarse en desarrollo para conectar herramientas como DBeaver.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- APLICACIÓN DJANGO ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # [CAMBIO PRODUCCIÓN]: Cambiar 'development' por 'production'.
      # Esto activa la imagen ligera, sin GCC y con usuario no-root.
      target: development
    image: sistema-registro-web:latest
    volumes:
      # [CAMBIO PRODUCCIÓN]: ELIMINAR la línea de abajo (./SistemaRegistro:/app).
      # En producción, el código debe ser inmutable y estar dentro de la imagen.
      - ./SistemaRegistro:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-SistemaRegistro.settings}
      - POSTGRES_HOST=db
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # [CAMBIO PRODUCCIÓN]: ELIMINAR la línea 'command' de abajo.
    # El Dockerfile ya tiene configurado Gunicorn para la etapa de producción.
    command: python manage.py runserver 0.0.0.0:8000

# --- VOLÚMENES PERSISTENTES ---
volumes:
  postgres_data:
  static_volume:
  media_volume:
