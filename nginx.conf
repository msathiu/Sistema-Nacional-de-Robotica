server {
    listen 80;
    server_name registro.fvrc.org.ve;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name registro.fvrc.org.ve;

    ssl_certificate /etc/letsencrypt/live/registro.fvrc.org.ve/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/registro.fvrc.org.ve/privkey.pem;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }
}
