services:
  db:
    image: postgres:15
    env_file: .env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: always

  web:
    build: .
    env_file: .env
    volumes:
      - ./SistemaRegistro:/app
      # - static_volume:/app/static
      - media_volume:/app/media
      - ./SistemaRegistro/staticfiles:/app/staticfiles
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # - ../test:/var/www/test
      # - static_volume:/app/static
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - media_volume:/app/media
      - ./SistemaRegistro/staticfiles:/app/staticfiles
    depends_on:
      - web
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

volumes:
  static_volume:
  media_volume:
  postgres_data: